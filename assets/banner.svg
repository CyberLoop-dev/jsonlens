<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="JSONLens banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b441"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#f0b441" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0b441" stop-opacity="0.04"/>
    </radialGradient>
  </defs>
  <style>
    .code { font: 18px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .k { fill: #7fb4ff; } .s { fill: #9fd88c; } .n { fill: #f2a07b; } .b { fill: #c9a0f0; } .p { fill: #8493ab; }
    .line { opacity: 0; animation: appear 9s ease-out infinite; }
    .l2 { animation-delay: .35s; } .l3 { animation-delay: .7s; } .l4 { animation-delay: 1.05s; }
    .l5 { animation-delay: 1.4s; } .l6 { animation-delay: 1.75s; }
    @keyframes appear { 0% { opacity: 0; transform: translateX(-10px); } 6%, 90% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
    .hl { animation: hl 9s steps(1, end) infinite; }
    @keyframes hl {
      0%, 24% { transform: translateY(100px); opacity: 0; }
      25%, 38% { transform: translateY(128px); opacity: 1; }
      39%, 52% { transform: translateY(156px); opacity: 1; }
      53%, 66% { transform: translateY(184px); opacity: 1; }
      67%, 80% { transform: translateY(212px); opacity: 1; }
      81%, 100% { transform: translateY(240px); opacity: 1; }
    }
    .lens { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep {
      0%, 22% { transform: translate(150px, 150px); opacity: 0; }
      28% { transform: translate(190px, 128px); opacity: 1; }
      45% { transform: translate(330px, 168px); opacity: 1; }
      62% { transform: translate(260px, 214px); opacity: 1; }
      80% { transform: translate(380px, 240px); opacity: 1; }
      95%, 100% { transform: translate(380px, 240px); opacity: 0; }
    }
    .caret { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: pulse 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { from { opacity: .35; transform: scale(.9); } to { opacity: .8; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; opacity: 1; } .hl, .lens, .caret, .glow { animation: none; } .hl, .lens { opacity: 0; } }
  </style>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle class="glow" cx="1080" cy="70" r="90" fill="#f0b441" opacity=".2"/>
  <circle class="glow" cx="1130" cy="260" r="60" fill="#ff7a59" opacity=".15"/>

  <!-- editor window -->
  <rect x="90" y="52" width="420" height="226" rx="16" fill="#0b0f1a" stroke="#f0b441" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="116" cy="74" r="5" fill="#f0b441"/>
  <circle cx="136" cy="74" r="5" fill="#ff7a59"/>
  <circle cx="156" cy="74" r="5" fill="#7fb4ff"/>
  <line x1="110" y1="90" x2="490" y2="90" stroke="#1e293b" stroke-width="2"/>

  <rect class="hl" x="102" y="0" width="396" height="26" rx="6" fill="#f0b441" fill-opacity=".14" opacity="0"/>

  <g class="code">
    <text class="line l1 p" x="118" y="118">{</text>
    <text class="line l2" x="118" y="146"><tspan class="k">  "name"</tspan><tspan class="p">: </tspan><tspan class="s">"Ada"</tspan><tspan class="p">,</tspan></text>
    <text class="line l3" x="118" y="174"><tspan class="k">  "roles"</tspan><tspan class="p">: [</tspan><tspan class="s">"admin"</tspan><tspan class="p">, </tspan><tspan class="s">"dev"</tspan><tspan class="p">],</tspan></text>
    <text class="line l4" x="118" y="202"><tspan class="k">  "id"</tspan><tspan class="p">: </tspan><tspan class="n">4821</tspan><tspan class="p">,</tspan></text>
    <text class="line l5" x="118" y="230"><tspan class="k">  "active"</tspan><tspan class="p">: </tspan><tspan class="b">true</tspan></text>
    <text class="line l6 p" x="118" y="258">}</text>
  </g>
  <rect class="caret" x="136" y="243" width="9" height="18" fill="#f0b441"/>

  <!-- magnifying lens sweeping across the code -->
  <g class="lens" opacity="0">
    <circle r="30" fill="url(#glass)" stroke="#f0b441" stroke-width="4"/>
    <line x1="22" y1="22" x2="44" y2="44" stroke="#f0b441" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="570" y="150" font-size="76" font-weight="700" fill="url(#title)" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">JSONLens</text>
  <text x="572" y="200" font-size="28" fill="#cbd5e1" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Messy JSON in, clean tree out.</text>
  <text x="572" y="245" font-size="20" fill="#64748b" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">HTML  •  CSS  •  Vanilla JS  •  Zero dependencies</text>
</svg>
